name: Release Prebuilt Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools on Linux x64
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build single-file release binary
        run: cargo build --release --locked --bin ap --target ${{ matrix.target }}
      - name: Smoke-test native binary where host matches
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            ./target/${{ matrix.target }}/release/ap.exe doctor
          else
            ./target/${{ matrix.target }}/release/ap doctor
          fi
      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp target/${{ matrix.target }}/release/ap.exe dist/ap.exe
            (cd dist && 7z a -tzip "ap-${{ matrix.target }}.zip" ap.exe && rm ap.exe)
          else
            cp target/${{ matrix.target }}/release/ap dist/ap
            chmod +x dist/ap
            tar -C dist -czf "dist/ap-${{ matrix.target }}.tar.gz" ap
            rm dist/ap
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/ap-${{ matrix.target }}.*

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum ap-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/ap-*
            artifacts/SHA256SUMS
