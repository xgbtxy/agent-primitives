  <text x="42" y="86" fill="#cbd5e1" font-family="ui-monospace, Consolas, Microsoft YaHei, monospace" font-size="12.5">x 起点盲猜：连读十几个废弃旧文件，摸不清主干与前后端契约</text>
  <text x="42" y="114" fill="#cbd5e1" font-family="ui-monospace, Consolas, Microsoft YaHei, monospace" font-size="12.5">x 思路被打断：Windows 报 GBK 乱码 / PS &amp;&amp; 语法错，被迫空转排错</text>
