  <rect x="470" y="20" width="430" height="236" rx="12" fill="#0f2229" stroke="#22c55e" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="492" y="52" fill="#4ade80" font-family="ui-sans-serif, system-ui, -apple-system, Microsoft YaHei, PingFang SC, sans-serif" font-size="15.5" font-weight="700">安装 ap 后 · 顺着 AI 思考与验证全链路铺平道路</text>
