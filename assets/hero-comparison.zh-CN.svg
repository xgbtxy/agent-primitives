  <text x="492" y="114" fill="#e2e8f0" font-family="ui-monospace, Consolas, Microsoft YaHei, monospace" font-size="12.5">✓ 思路绝不中断：无感治愈 UTF-8/BOM/PS 语法坑 + 语法树安全改码</text>
  <text x="492" y="142" fill="#e2e8f0" font-family="ui-monospace, Consolas, Microsoft YaHei, monospace" font-size="12.5">✓ 像真人点页面：4.5s 直连系统自带无头 Edge 真机点击验收</text>
  <text x="492" y="170" fill="#e2e8f0" font-family="ui-monospace, Consolas, Microsoft YaHei, monospace" font-size="12.5">✓ 自动发现自改：2ms 硬门禁拦住一切断链与 Slop，一次交出好代码</text>
